<!DOCTYPE html>
<html lang="ru" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Каталог товаров</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Каталог товаров</h1>

    <div class="nav-bar">
        <div>
            <a href="/">На главную</a> |
            <a href="/orders"><strong>Оформить заказ / Мои заказы</strong></a>
        </div>

        <div th:if="${currentUser == null}">
            <a href="/login">Войти</a> |
            <a href="/register">Регистрация</a>
        </div>

        <div th:if="${currentUser != null}" style="display: flex; gap: 12px; align-items: center;">
            <span>Вы вошли как: <strong th:text="${currentUser.name}"></strong></span>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn-secondary">Выйти</button>
            </form>
        </div>
    </div>

    <form method="get" action="/products" class="search-form">
        <input type="number" name="id" placeholder="Поиск по ID">
        <input type="text" name="title" placeholder="Название товара">
        <select name="categoryId">
            <option value="">Все категории</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}">
            </option>
        </select>
        <input type="number" step="0.01" name="minPrice" placeholder="Цена от">
        <input type="number" step="0.01" name="maxPrice" placeholder="Цена до">
        <button type="submit">Найти</button>
        <a href="/products">Сбросить</a>
    </form>

    <br>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Категория</th>
            <th>Описание</th>
            <th>Цена</th>
            <th>Остаток</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.title}"></td>
            <td th:text="${product.category.name}"></td>
            <td th:text="${product.description}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.stockQuantity}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

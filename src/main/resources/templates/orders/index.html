<!DOCTYPE html>
<html lang="ru" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Оформление заказа</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Оформление заказа</h1>

    <p>
        <a href="/">На главную</a> |
        <a href="/products">Каталог товаров</a> |
        <a href="/orders/history">История заказов</a>
    </p>

    <!-- Сообщения об успехе или ошибке транзакции -->
    <div th:if="${param.success}" style="color: green; font-weight: bold;">
        Заказ успешно оформлен! Остатки на складе обновлены.
    </div>
    <div th:if="${errorMessage}" style="color: red; font-weight: bold;" th:text="${errorMessage}"></div>

    <br>

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <p>
            Вы вошли как: <strong th:text="${currentUser.name + ' (' + currentUser.email + ')'}"></strong> |
            <a href="/products">Каталог товаров</a>
        </p>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Выйти</button>
        </form>
    </div>

    <form method="post" th:action="@{/orders}">

        <h3>Выберите товары и количество:</h3>
        <table>
            <thead>
            <tr>
                <th>Товар</th>
                <th>Категория</th>
                <th>Цена</th>
                <th>В наличии</th>
                <th>Купить (шт.)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.title}"></td>
                <td th:text="${product.category.name}"></td>
                <td th:text="${product.price}"></td>
                <td th:text="${product.stockQuantity}"></td>
                <td>
                    <!-- Spring автоматически соберёт эти поля в Map<Long, Integer> quantities -->
                    <input type="number"
                           th:name="|quantities[${product.id}]|"
                           min="0"
                           value="0"
                           style="width: 60px;">
                </td>
            </tr>
            </tbody>
        </table>

        <br>
        <button type="submit">Оформить заказ</button>
    </form>
</div>
</body>
</html>
